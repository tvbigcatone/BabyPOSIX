name: Temporary source export
on:
  push:
    branches:
      - assistant/export-session11-20261022
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/export-session11-20261022
      - name: Package source snapshot
        run: zip -qr babyposix-session11.zip BabyPOSIX
      - uses: actions/upload-artifact@v4
        with:
          name: babyposix-session11-source
          path: babyposix-session11.zip
          if-no-files-found: error
          retention-days: 1
